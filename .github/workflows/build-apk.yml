name: Build aj ai APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'

      - name: Install Android NDK & CMake
        run: |
          sudo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Generate Blue Flower App Icon
        run: |
          pip install Pillow
          python3 -c "
          from PIL import Image, ImageDraw
          import os
          sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          for name, size in sizes.items():
              path = f'android/app/src/main/res/mipmap-{name}'
              os.makedirs(path, exist_ok=True)
              img = Image.new('RGBA', (size, size), (0, 0, 0, 0))
              draw = ImageDraw.Draw(img)
              margin = size // 10
              draw.ellipse([margin, margin, size - margin, size - margin], fill=(30, 100, 220, 255))
              c = size // 2
              r = size // 5
              draw.ellipse([c - r, c - r, c + r, c + r], fill=(255, 220, 0, 255))
              img.save(f'{path}/ic_launcher.png')
              img.save(f'{path}/ic_launcher_round.png')
          "

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Android APK (Release ARM64)
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aj-ai-release
          path: build/app/outputs/flutter-apk/app-release.apk
