name: Build aj ai APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache Gradle and C++ Build Files
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.cxx
            android/app/.cxx
          key: ${{ runner.os }}-gradle-cxx-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-cxx-

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Dummy google-services.json (Fix Firebase Error)
        run: |
          mkdir -p android/app/src/debug android/app/src/release android/app/src/prodDebug android/app/src/prodRelease
          echo '{
            "project_info": { "project_number": "1234567890", "project_id": "aj-ai-offline" },
            "client": [{
              "client_info": { "mobilesdk_app_id": "1:1234567890:android:1234567890abcdef" },
              "api_key": [{ "current_key": "AIzaSyDummyKeyForOfflineApp00000000" }]
            }],
            "configuration_version": "1"
          }' > android/app/google-services.json
          cp android/app/google-services.json android/app/src/debug/google-services.json
          cp android/app/google-services.json android/app/src/release/google-services.json
          cp android/app/google-services.json android/app/src/prodDebug/google-services.json || true
          cp android/app/google-services.json android/app/src/prodRelease/google-services.json || true

      - name: Generate Blue Flower App Icon
        run: |
          pip install Pillow
          python3 -c "
          from PIL import Image, ImageDraw
          import os
          sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          for name, size in sizes.items():
              path = f'android/app/src/main/res/mipmap-{name}'
              os.makedirs(path, exist_ok=True)
              img = Image.new('RGBA', (size, size), (0, 0, 0, 0))
              draw = ImageDraw.Draw(img)
              margin = size // 10
              draw.ellipse([margin, margin, size - margin, size - margin], fill=(30, 100, 220, 255))
              c = size // 2
              r = size // 5
              draw.ellipse([c - r, c - r, c + r, c + r], fill=(255, 220, 0, 255))
              img.save(f'{path}/ic_launcher.png')
              img.save(f'{path}/ic_launcher_round.png')
          "

      - name: Build Android APK (ARM64 Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -Pandroid.injected.build.abi=arm64-v8a --parallel --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aj-ai-release
          path: android/app/build/outputs/apk/**/*.apk
