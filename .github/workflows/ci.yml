name: Build aj ai APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          if [ -f yarn.lock ]; then
            yarn install --ignore-engines
          else
            npm install --legacy-peer-deps
          fi

      - name: Generate Blue Flower App Icon
        run: |
          pip install Pillow
          python3 -c "
          from PIL import Image, ImageDraw
          import os
          sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          for name, size in sizes.items():
              path = f'android/app/src/main/res/mipmap-{name}'
              os.makedirs(path, exist_ok=True)
              img = Image.new('RGBA', (size, size), (0, 0, 0, 0))
              draw = ImageDraw.Draw(img)
              margin = size // 10
              draw.ellipse([margin, margin, size - margin, size - margin], fill=(30, 100, 220, 255))
              c = size // 2
              r = size // 5
              draw.ellipse([c - r, c - r, c + r, c + r], fill=(255, 220, 0, 255))
              img.save(f'{path}/ic_launcher.png')
              img.save(f'{path}/ic_launcher_round.png')
          "

      - name: Build Android APK (ARM64)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -Pandroid.injected.build.abi=arm64-v8a --parallel --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aj-ai-release
          path: android/app/build/outputs/apk/release/app-release.apk
